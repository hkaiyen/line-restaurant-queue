<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>加入排隊 - LINE 餐廳候補位</title>
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <style>
        :root {
            --primary: #00B900;
            --primary-dark: #009900;
            --text: #333;
            --text-light: #666;
            --bg: #f5f5f5;
            --white: #fff;
            --border: #e0e0e0;
            --danger: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--white);
            color: var(--primary);
            border: 2px solid var(--primary);
            margin-top: 12px;
        }

        .restaurant-select {
            display: grid;
            gap: 12px;
        }

        .restaurant-option {
            display: flex;
            align-items: center;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .restaurant-option:hover {
            border-color: var(--primary);
        }

        .restaurant-option.selected {
            border-color: var(--primary);
            background: #f0fff0;
        }

        .restaurant-option input {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
        }

        .restaurant-info {
            flex: 1;
        }

        .restaurant-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .restaurant-detail {
            font-size: 13px;
            color: var(--text-light);
        }

        .restaurant-waiting {
            text-align: right;
        }

        .waiting-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #fff3cd;
            color: #856404;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .success-overlay.show {
            display: flex;
        }

        .success-card {
            background: var(--white);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .success-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        .queue-number {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            margin: 16px 0;
        }

        .queue-info {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            background: #fff0f0;
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Loading -->
        <div id="loading" class="loading show">
            <div class="spinner"></div>
            <p>載入中...</p>
        </div>

        <!-- Main Content -->
        <div id="mainContent" style="display: none;">
            <div class="header">
                <h1>🍜 加入排隊</h1>
                <p>選擇餐廳並填寫排隊資料</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="card">
                <form id="joinQueueForm">
                    <!-- 餐廳選擇 -->
                    <div class="form-group">
                        <label>選擇餐廳</label>
                        <div class="restaurant-select" id="restaurantList">
                            <!-- 動態載入 -->
                        </div>
                    </div>

                    <!-- 用餐人數 -->
                    <div class="form-group">
                        <label for="partySize">用餐人數</label>
                        <select id="partySize" required>
                            <option value="">請選擇人數</option>
                            <option value="1">1 人</option>
                            <option value="2">2 人</option>
                            <option value="3">3 人</option>
                            <option value="4">4 人</option>
                            <option value="5">5 人</option>
                            <option value="6">6 人</option>
                            <option value="7">7 人</option>
                            <option value="8">8 人</option>
                            <option value="9">9 人</option>
                            <option value="10">10 人以上（請致電餐廳）</option>
                        </select>
                    </div>

                    <!-- 備註 -->
                    <div class="form-group">
                        <label for="notes">備註（選填）</label>
                        <textarea id="notes" placeholder="例如：過敏原、嬰兒座椅、輪椅需求等"></textarea>
                        <div class="form-hint">可填寫特殊需求或飲食限制</div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        加入排隊
                    </button>
                </form>
            </div>

            <button class="btn btn-secondary" onclick="location.href='status.html'">
                📋 查看我的排隊狀態
            </button>
        </div>
    </div>

    <!-- 成功彈窗 -->
    <div id="successOverlay" class="success-overlay">
        <div class="success-card">
            <div class="success-icon">✓</div>
            <div class="success-title">排隊成功！</div>
            <div class="queue-number" id="queueNumber">--</div>
            <div class="queue-info" id="queueInfo">
                請留意手機通知<br>
                輪到您時會收到LINE通知
            </div>
            <button class="btn btn-primary" onclick="closeSuccessAndCheckStatus()">
                查看排隊進度
            </button>
        </div>
    </div>

    <script>
        // =====================================================
        // LIFF SDK 初始化
        // =====================================================
        
        const LIFF_ID = {
            joinQueue: '2006710601-AJpy9Vdb',  // 請根據實際 LIFF ID 修改
        };

        const API_BASE = window.location.origin;

        let currentUserId = null;

        async function initLIFF() {
            try {
                await liff.init({ 
                    liffId: LIFF_ID.joinQueue,
                    withLoginOnExternalBrowser: true 
                });
                
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentUserId = profile.userId;
                    console.log('✅ LIFF 登入成功，使用者：', profile.displayName);
                    loadRestaurants();
                } else {
                    // 嘗試登入
                    liff.login();
                }
            } catch (error) {
                console.error('❌ LIFF 初始化失敗：', error);
                // 為了開發測試，使用假的 userId
                currentUserId = 'UtestUser123456';
                loadRestaurants();
            }
        }

        // =====================================================
        // API 呼叫
        // =====================================================

        async function loadRestaurants() {
            try {
                const response = await fetch(`${API_BASE}/liff/restaurants`);
                const result = await response.json();

                if (result.success) {
                    renderRestaurantList(result.data.restaurants);
                    document.getElementById('mainContent').style.display = 'block';
                    document.getElementById('loading').classList.remove('show');
                } else {
                    showError('載入餐廳資料失敗');
                }
            } catch (error) {
                console.error('載入餐廳失敗：', error);
                // 使用示範資料
                renderDemoRestaurants();
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('loading').classList.remove('show');
            }
        }

        function renderRestaurantList(restaurants) {
            const container = document.getElementById('restaurantList');
            container.innerHTML = restaurants.map((r, i) => `
                <label class="restaurant-option" data-restaurant-id="${r.id}">
                    <input type="radio" name="restaurant" value="${r.id}" required>
                    <div class="restaurant-info">
                        <div class="restaurant-name">${r.name}</div>
                        <div class="restaurant-detail">${r.address || ''}</div>
                    </div>
                    <div class="restaurant-waiting">
                        <span class="waiting-badge">等待 ${r.currentWaiting || 0} 組</span>
                    </div>
                </label>
            `).join('');

            // 點擊整个 label 也可选中
            container.querySelectorAll('.restaurant-option').forEach(option => {
                option.addEventListener('click', () => {
                    container.querySelectorAll('.restaurant-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    option.querySelector('input').checked = true;
                });
            });
        }

        function renderDemoRestaurants() {
            renderRestaurantList([
                { id: 'demo-rest-1', name: '巷口牛肉麵', address: '台北市大安區忠孝東路100號', currentWaiting: 5 },
                { id: 'demo-rest-2', name: '幸福小館', address: '台北市信義區忠孝東路200號', currentWaiting: 3 },
                { id: 'demo-rest-3', name: '川味麻辣鍋', address: '台北市松山區南京東路300號', currentWaiting: 8 },
            ]);
        }

        // =====================================================
        // 表單提交
        // =====================================================

        document.getElementById('joinQueueForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const selectedRestaurant = document.querySelector('input[name="restaurant"]:checked');
            const partySize = document.getElementById('partySize').value;
            const notes = document.getElementById('notes').value.trim();

            if (!selectedRestaurant) {
                showError('請選擇餐廳');
                return;
            }

            if (!partySize) {
                showError('請選擇用餐人數');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '處理中...';

            try {
                const response = await fetch(`${API_BASE}/liff/queue/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUserId,
                        restaurantId: selectedRestaurant.value,
                        partySize: parseInt(partySize),
                        notes: notes || null,
                    }),
                });

                const result = await response.json();

                if (result.success) {
                    showSuccess(result.data);
                } else {
                    showError(result.error || '加入排隊失敗');
                }
            } catch (error) {
                console.error('加入排隊失敗：', error);
                // 示範模式：顯示成功
                showSuccess({
                    queueEntry: {
                        queueNumber: Math.floor(Math.random() * 20) + 10,
                        partySize: parseInt(partySize),
                        position: Math.floor(Math.random() * 5) + 1,
                    },
                    restaurant: { name: selectedRestaurant.closest('.restaurant-option').querySelector('.restaurant-name').textContent },
                });
            }

            submitBtn.disabled = false;
            submitBtn.textContent = '加入排隊';
        });

        // =====================================================
        // 成功彈窗
        // =====================================================

        function showSuccess(data) {
            document.getElementById('queueNumber').textContent = `第 ${data.queueEntry.queueNumber} 號`;
            document.getElementById('queueInfo').innerHTML = `
                <strong>${data.restaurant.name}</strong><br>
                前方等待：${data.queueEntry.position - 1} 組<br>
                預估等候：${data.queueEntry.estimatedWaitMinutes || '?'} 分鐘
            `;
            document.getElementById('successOverlay').classList.add('show');
        }

        function closeSuccessAndCheckStatus() {
            document.getElementById('successOverlay').classList.remove('show');
            // 關閉 LIFF 視窗或跳轉到狀態頁
            const statusUrl = `status.html?userId=${currentUserId}`;
            if (liff.isInClient()) {
                liff.openWindow({
                    url: window.location.origin + '/liff/queue/status.html?userId=' + currentUserId,
                    external: true
                });
            } else {
                window.location.href = statusUrl;
            }
        }

        // =====================================================
        // 錯誤顯示
        // =====================================================

        function showError(message) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }

        // =====================================================
        // 啟動
        // =====================================================

        document.addEventListener('DOMContentLoaded', initLIFF);
    </script>
</body>
</html>
